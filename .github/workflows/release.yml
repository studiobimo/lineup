name: Release

#   push to main -> semantic-release reads the Conventional Commits since the last tag and,
#                   if one is releasable, tags it and cuts the GitHub Release
#
# A job that builds or publishes what was released belongs in this same workflow,
# gated on `needs.release.outputs.release-created == 'true'`. A tag created with
# GITHUB_TOKEN does not trigger another workflow -- GitHub suppresses that to stop
# runaway loops -- so a separate `on: push: tags` publisher would silently never fire.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: studiobimo/.github/.github/workflows/semantic-release.yml@v1
