version: 2
updates:
  # >>> template:base
  - package-ecosystem: github-actions
    directory: /
    # Pull requests go to develop, which ships to development (ADR-0019). Without this,
    # Dependabot opens them against the default branch, main.
    target-branch: develop
    # Monthly: every update run, and every rebase of an open PR, is a billed Actions run
    # on a private repository. Security updates ignore the schedule.
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The tools in mise.toml are not here: Dependabot does not read that file. They are
  # bumped by hand in studiobimo/project-template and arrive with `make -C .devtools sync`.
  # <<< template:base

  # >>> template:vite
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1, so a TypeScript bump waits for it.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
  # <<< template:vite
